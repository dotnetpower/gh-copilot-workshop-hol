[project]
name = "autogen-group-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "tiktoken>=0.12.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "autogen-core>=0.7.5",
    "autogen-ext>=0.7.5",
    "rich>=14.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-s -v"
